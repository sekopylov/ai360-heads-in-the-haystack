name: rh-a100
desc: paper-scale grid on one A100 (g2.1, 80 GB), large prefill chunks

# Why this config
# ---------------
# Same grid as `paper.yaml` (9 geometric lengths over 1K-49K, 10 depths, 3 needles),
# so its numbers are comparable -- with differences that are about the card, not the
# science:
#
#   * `--prefill-chunk 8192` instead of the 4096 default.  Chunking does NOT repeat
#     layer work (each token belongs to one chunk); it bounds the attention score
#     matrix at O(chunk x seq), which is what keeps a float32 SDPA fallback from
#     materialising (heads, seq, seq) -- that OOM'd a 22 GiB card at 16K
#     (docs/datasphere-findings.md section 18).  At 49K/8192 the fallback's matrix is
#     8192 x 49152 x 4 bytes per Q-head = 1.61 GB, so ~12.9 GB for the hybrid's 8 heads
#     and ~25.8 GB for the dense model's 16 (math SDPA expands GQA to Q-heads; by
#     KV-heads it would be 3.2 and 12.9 GB).  Both fit in 80 GB, neither fits in 22 --
#     which is the whole reason the chunk exists.  Feeding everything in one shot saves
#     only ~4-8% of the attention time and gives the bound up entirely.
#     On the *bf16* path this run actually takes, flash SDPA never materialises that
#     matrix at all (the same tensor would be half the fp32 size), and the binding
#     chunk-sized allocation was the `lm_head` logits over every position of every
#     chunk (~4.1 GB at 8192 x 248320 for the hybrid, ~2.6 GB for the dense model),
#     which `prefill_cache` now avoids with `logits_to_keep=1`.  So the memory argument
#     for chunking is about the fp32 fallback, and the chunk size is now bounded by
#     that, not by the logits.
#   * `--max-new-tokens 96` for detect *and* mask.  The `paper` profile's 48 truncates
#     11 of the hybrid's 75 instances at the t4 grid; a truncated instance scores
#     lower -- recomputed from `ds-results/qwen3.5-0.8b/instances_next_step.jsonl`,
#     split on `meta.truncated`: 0.671 on the top head (L11H1) for the 11 truncated
#     instances against 0.755 for the other 64 -- because the model answers and then
#     keeps narrating, which is where the extra needle-token copies would come from.
#     `mask` runs at the CLI's 32-token default otherwise, i.e. *tighter* than the
#     48 the committed t4 tree used on the stage that carries the causal claim.
#   * `--preflight` for detect: all 270 prompts are built and validated (CPU only)
#     before the first forward pass, because one prompt whose haystack cannot be
#     located verbatim would otherwise abort the stage hours into the run.  The L4
#     scales leave it off.
#
# Budget, in passes rather than adjectives (the arithmetic is checkable; the wall clock
# is an estimate to refine from the preflight log).  Every generation is preceded by its
# own prefill -- `evaluate_samples` calls `greedy_generate` -> `prefill_cache` once per
# sample per configuration -- so the unit is "prefill + decode", not "prefill":
#   detect  210 + 270 = 480 passes at 1K-49K, 96 tokens each;
#   mask    45 samples per point x [1 baseline + 6 K x (1 retrieval + 5 random)]
#           = 1665 passes for the dense model, 1395 for the hybrid (its 0.01 and 0.02
#           collapse to K=1, so five distinct points, not six), all at 4-16K;
#   mixer   hybrid only: mixer_k = (1,2,4) x 3 trials x 2 stacks x 45 = 810.
# Total ~4.35k passes, of which ~3.87k are the 4-16K ablations.  The dominant cost is
# therefore `mask`, and the knob that cuts it is `--random-trials` (5 -> 3 removes ~990
# passes, ~23% of the whole run, because the random arm is five sixths of each point);
# cutting the mixer ablation saves 810 at most and is the *second* choice.
#
# The hybrid's last point is degenerate by construction: the random arm is drawn from
# heads at or below the threshold, and the CPU probe puts that pool at 11-12 heads under
# `haystack` (13 under `prompt`).  `--k-frac 0.33` resolves to K=16 on 48 heads, so
# `matched_k` caps both arms at the pool size: the point is one deterministic
# intervention on the whole pool, not a curve point.  Read
# `retrieval_pool_by_domain` in the preflight summary first: if the pool is under 12,
# either drop `0.33` for this model or mark the `control_exhausted` points as one
# intervention in the report.  The artifact already records `k_effective`,
# `control_exhausted` and `random_distinct` for exactly this reading.
#
# Stage list: no `qa`/`cot`.  Their built-in sets are 8+8 hand-written items -- a
# pipeline check worth a minute on the L4, not A100 time, and one item is 12.5 points
# so they cannot support the paper's Sec. 5.3 claim either way.  A real measurement
# needs `--data file.jsonl`; until then the downstream stage belongs on the cheap
# grid (`t4-cached.yaml`), and `a100-resume.yaml` can add it to a finished A100 tree.
#
# Open decision the launcher must make: the sink geometry.  The `a100` scale pins
# `--argmax-domain haystack` (the paper's `a in R^{|x|}`), but with the chat template
# the attention sink at sequence position 0 sits *before* the haystack, so it can
# never suppress criterion (2) and the >0.1 share inflates.  The measured pair is in
# `a100-notemplate.yaml` (the same grid with `--no-chat-template`); in short, on the
# CPU probe the dense model gives 38% of heads above 0.1 with the template and 6%
# without -- but without it the same model recovers only 0.55 of the needle, while the
# hybrid is 75-77% either way with recall 1.00.  So this config is the run comparable
# with the committed `ds-results/` tree (same geometry, task solved), and
# `a100-notemplate.yaml` is the paper-comparable one.  Launching both is the honest
# option; whichever is run, say which and why in the results doc.
#
# Note the *domain* axis is no longer part of this decision: since round seven every
# captured domain is scored in the same pass and written as its own matrix
# (`scores_<pairing>_<domain>`), and the summary reports `sparsity_by_domain`,
# `domain_ranking_overlap` and `retrieval_pool_by_domain`.  The template axis is a
# property of the prompt, so it cannot be derived from this run -- price it first with
# `a100-preflight.yaml` and `a100-preflight-notemplate.yaml` (describe,detect at two
# lengths, ~minutes).
#
# Honest note on the grid: the paper's own detection grid is 20 lengths sampled
# uniformly over 1K-50K (with 10 depths and 3 needle sets, ~600 instances per model);
# this profile is 9 geometric lengths, i.e. 270 per model, and for Qwen3-0.6B the two
# longest are dropped by `within_context_limit` (its max_position_embeddings is 40960),
# leaving 7 x 10 x 3 = 210.  If the A100 is being paid for, widening `--lengths` to
# the paper's 20 is the knob to turn -- it is the cheapest way to make the run
# actually paper-scale.
#
# What it costs (Russia, incl. VAT, from the DataSphere pricing page):
#   gt4i.1 (L4)  234.00 RUB/hour
#   g2.1  (A100) 542.88 RUB/hour   -- 2.32x the L4
# so this is worth launching when wall clock matters or when the long contexts
# dominate, and the t4 grid on the L4 is the right place to validate a change first.
#
# Prerequisites, both already done:
#   * the project-disk venv has flash-linear-attention (configs/datasphere/t4-venv.yaml)
#     -- without it the hybrid's 18 linear layers run the reference PyTorch path;
#   * `torch arch list` includes sm_80.  The SDPA flash-backend probe in the venv job
#     ran on an L4 (sm_89), so "flash works on sm_80" is still an inference from the
#     wheel's arch list, not a measurement on an A100 -- run
#     `configs/datasphere/a100-preflight.yaml` (describe,detect at 1024/4096,
#     `--limit 60`) before the full grid; it is minutes and it answers the hardware
#     question and the sink-geometry question on the real grid.
#
# Also here: `a100-resume.yaml` re-runs only the tail (`compare,figures,case-study`) on
# a finished tree, because `mask` is the stage that costs real money (45 samples per
# point, ~3.9k prefill+decode passes in the ablations).

cmd: python3 scripts/datasphere_job.py --use-venv ${DS_PROJECT_HOME}/ai360-heads-in-the-haystack/venv --weights ${WEIGHTS} --models qwen3.5-0.8b qwen3-0.6b --profile a100 --dtype bfloat16 --stages describe,detect,mask,compare,figures,case-study --out-prefix ds-results-a100

flags:
  - attach-project-disk

inputs:
  - models:
      var: WEIGHTS

outputs:
  - ds-results-a100

env:
  vars:
    PYTORCH_ALLOC_CONF: expandable_segments:True
  python:
    type: manual
    version: "3.10"
    requirements-file: scripts/requirements-platform.txt
    pip:
      no-deps: 'true'
    local-paths:
      - retrieval_heads
      - configs
      - scripts

cloud-instance-types:
  - g2.1               # 28 vCPU, 1x A100 80 GB
  # No V100 fallback on purpose: the 8192-token chunks at 49K are sized for 80 GB, and
  # bf16 is not natively supported on sm_70, so a V100 would fail rather than degrade.
  # A smaller-card run is `paper.yaml`'s job.
