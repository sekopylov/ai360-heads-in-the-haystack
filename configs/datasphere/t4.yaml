name: rh-t4
desc: full pipeline on a single T4 (gt4i.1 / gt4.1), t4 scale, float32

cmd: python3 scripts/datasphere_job.py --weights ${WEIGHTS} --models qwen3.5-0.8b qwen3-0.6b --profile t4 --dtype bfloat16 --stages describe,detect,mask,qa,cot,compare,figures --out-prefix ds-results

inputs:
  - models:
      var: WEIGHTS

outputs:
  - ds-results

env:
  vars:
    PYTORCH_ALLOC_CONF: expandable_segments:True
  python:
    type: manual
    version: "3.10"
    requirements-file: scripts/requirements-datasphere.txt
    # See t4-smoke.yaml: the requirements file is a complete exact lock, and
    # `no-deps` avoids pip 25.1.1's get_topological_weights AssertionError.
    pip:
      no-deps: 'true'
    local-paths:
      - retrieval_heads
      - configs
      - scripts

cloud-instance-types:
  - gt4i.1             # 8 vCPU / 32 GB RAM / 1x T4i, 24 GB VRAM
  - gt4.1              # 4 vCPU / 16 GB RAM / 1x T4, 16 GB VRAM (fallback)
