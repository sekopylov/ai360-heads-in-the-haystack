name: rh-a100-resume
desc: remaining stages (compare,figures,case-study) on the A100, reusing a finished a100 run's detect/mask

# Why this config exists
# ----------------------
# `mask` is the A100 run's most expensive stage (its sample set is 3 lengths x 5 depths
# x 3 needles = 45 samples per point, against the t4 run's 10), so a failure in a later
# stage must not cost the heavy stages again.  `t4-resume.yaml` is the same idea for the
# L4 scale; this is its A100 counterpart, and it exists because the a100 tree has a
# different `--out-prefix` and scale, which `t4-resume.yaml` hard-codes.
#
# Its stage list is the *tail* of `a100.yaml`/`a100-notemplate.yaml`: those two no
# longer run `qa`/`cot` (8+8 hand-written items are a pipeline check, not A100 time),
# so this one does not either.  Add them here -- with `--data file.jsonl` to make them
# a measurement -- if a finished A100 tree needs the downstream stage.

# How the previous artifacts reach the job
# ----------------------------------------
# `local-paths` uploads local directories into the job's working directory, so the
# staged tree `ds-a100-resume/` arrives at /job/ds-a100-resume and `--out-prefix
# ds-a100-resume` makes every stage read and write exactly that tree:
#   qa/cot   -> --out  ds-a100-resume/<model>      (needs scores_*.npz + sidecars)
#   compare  -> --runs ds-a100-resume/<models> --out ds-a100-resume
#   figures  -> --runs ds-a100-resume/<models> --out ds-a100-resume/figures
# Nothing is written to the shared project disk; `outputs` brings the merged tree back.
#
# Before launching, stage the artifacts from the finished run:
#   cp -r <downloaded>/ds-results-a100/. ds-a100-resume/
# (`ds-a100-resume/` is gitignored.)
#
# `--resume` skips every (stage, model) whose `run_state.json` entry is `ok` and whose
# artifact is present in the staged tree, so re-launching after a late failure costs only
# the stages that actually failed.  Since the staged tree already holds `mask`, this is
# what turns "the tail crashed" into "the tail re-runs".  It is opt-in: the monolithic
# `a100.yaml`/`a100-notemplate.yaml` leave it off so a fresh full run can never skip a
# stage on the strength of a stale artifact.

cmd: python3 scripts/datasphere_job.py --use-venv ${DS_PROJECT_HOME}/ai360-heads-in-the-haystack/venv --bootstrap-venv ${DS_PROJECT_HOME}/ai360-heads-in-the-haystack/venv --weights ${WEIGHTS} --models qwen3.5-0.8b qwen3-0.6b --profile a100 --dtype bfloat16 --verify-hashes --resume --stages compare,figures,case-study --out-prefix ds-a100-resume

flags:
  - attach-project-disk

inputs:
  - models:
      var: WEIGHTS

outputs:
  - ds-a100-resume

env:
  vars:
    PYTORCH_ALLOC_CONF: expandable_segments:True
  python:
    type: manual
    version: "3.10"
    requirements-file: scripts/requirements-platform.txt
    pip:
      no-deps: 'true'
    local-paths:
      - retrieval_heads
      - configs
      - scripts
      - ds-a100-resume

cloud-instance-types:
  - g2.1               # 28 vCPU, 1x A100 80 GB
