name: rh-a100-weights
desc: populate the project-disk weights cache for the scale-up round (no stages, no GPU)

# Why this config exists
# ----------------------
# The CLI caps a job's `inputs` **plus** its `local-paths` zips at 10 GiB total and 5 GiB
# per file (`UPLOAD_FILES_MAX_TOTAL_SIZE_BYTES`), which is how the current 3.2 GB of
# weights travel.  Every model the scale-up round needs is bigger than that: Qwen3-8B is
# 16.4 GB, Qwen3-30B-A3B 61 GB, Qwen3.5-35B-A3B 72 GB.  So they cannot ride along with a
# config -- they have to live where a job can attach them, and the project disk (500 GB
# here) is the only path that does not re-download them for every job.
#
# This job fills that cache.  It runs no stage, needs no GPU, and writes only into
# ${DS_PROJECT_HOME}/models: the disk is shared, so nothing is ever deleted, and a file
# that is already there *with its pinned digest* is left alone -- re-running resumes.
# Every file is verified against `configs/models.json` after download, written as
# `<name>.part` until the digest matches, so an interrupted run cannot leave something
# that a later `--verify-hashes` would accept.
#
# Run it once (a few hours for ~220 GiB at job bandwidth), then every A100 config can use
# `--weights ${DS_PROJECT_HOME}/ai360-heads-in-the-haystack/models` instead of `${WEIGHTS}`.
# The path is namespaced under our own directory because the disk is shared -- the same
# reason `test_cached_configs_use_a_namespaced_venv_path` insists on it for the venv.
#
# Re-running is free for what is already there (a file whose digest matches is skipped),
# so this list is the *whole* round and a second run adds only what is missing: the two
# Ministral models were added after the first launch and land on the next run.
#
# The Ministral pair is the `-BF16` re-release, not the Instruct default: Mistral ships
# the Instruct weights as FP8, and this project loads bf16.  Both are the same
# architecture (34 and 40 layers, 32 Q-heads, `sliding_window: null` -- every layer is
# global), and their native window is 16K stretched by YaRN x16, so 49K is extrapolation
# for them even though the config says 262144.
#
# The digests for files that are not on this laptop came from the Hub's own LFS metadata
# (`scripts/pin_registry.py`), which is why the verification here is not a formality: it
# is the first time those pins meet the real bytes.

cmd: python3 scripts/datasphere_job.py --fetch-weights ${DS_PROJECT_HOME}/ai360-heads-in-the-haystack/models --models qwen3.5-0.8b qwen3-0.6b qwen3-4b qwen3-8b qwen3-30b-a3b qwen3.5-4b qwen3.5-9b qwen3.5-35b-a3b ministral-3-8b ministral-3-14b

flags:
  - attach-project-disk

# No `inputs`: the whole point is that the weights do not travel with the job.

env:
  python:
    type: manual
    version: "3.10"
    requirements-file: scripts/requirements-platform.txt
    pip:
      no-deps: 'true'
    local-paths:
      - retrieval_heads
      - configs
      - scripts

cloud-instance-types:
  - c1.4               # 4 vCPU / 32 GB: network-bound, no GPU and no torch needed
