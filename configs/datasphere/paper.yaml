name: rh-paper
desc: paper-scale grid on GPU

cmd: python3 scripts/datasphere_job.py --weights ${WEIGHTS} --models qwen3.5-0.8b qwen3-0.6b --profile paper --dtype bfloat16 --stages describe,detect,mask,qa,cot,compare,figures --out-prefix ds-results

inputs:
  - models:
      var: WEIGHTS

outputs:
  - ds-results

env:
  python:
    type: manual
    version: "3.10"
    requirements-file: scripts/requirements-datasphere.txt
    # See docs/datasphere-findings.md section 3: pip 25.1.1 aborts on this
    # dependency graph, so the exact lock is installed without resolving deps.
    pip:
      no-deps: 'true'
    local-paths:
      - retrieval_heads
      - configs
      - scripts

cloud-instance-types:
  - g2.1
  - g1.1
