name: rh-a100-preflight
desc: short A100 preflight -- two lengths, both argmax domains, no mask stage

# Why this config exists
# ----------------------
# `a100.yaml` pins the paper's `haystack` argmax domain, which had never been measured
# at any scale before the grid was written, and its own comment says the first A100 job
# should start with `--stages describe,detect` at a short length.  Until the driver
# learned `--lengths`/`--limit` that advice was not executable without editing `SCALES`
# (and remembering to revert it), so the preflight lived in a comment.
#
# What it answers, for a few minutes of A100 instead of a few hours:
#   * does the SDPA flash backend actually work on sm_80?  The venv probe ran on an L4
#     (sm_89), so "flash works on an A100" was an inference from the wheel's arch list;
#   * how far apart are the `haystack` and `prompt` domains on the real grid?  Since
#     round seven every captured domain is scored in the same pass, so this run writes
#     `scores_<pairing>_prompt.*` beside `scores_<pairing>.*` and reports the >0.1 share
#     of each (plus `domain_ranking_overlap`, i.e. how much a domain change would change
#     the set the masking arm masks);
#   * does the sink sit inside or outside `x` on this prompt?  `sink_in_haystack` says
#     so, and it is the number that decides whether `--no-chat-template` is needed to
#     reproduce the paper's geometry.  That variant is a *different prompt*, so it
#     cannot be derived from this run: launch
#     `configs/datasphere/a100-preflight-notemplate.yaml` beside it (identical grid,
#     `--no-chat-template` on the driver) and compare;
#   * how big is the random arm's pool per domain (`retrieval_pool_by_domain`)?  `mask`
#     draws its control from heads at or below the threshold, so a small pool means the
#     causal curve degenerates -- on the hybrid (48 scoreable heads) the committed
#     `prompt` domain left 15.  **This is the pool of *this* tree** (2 lengths, 60
#     instances); the full run's `mask` draws from the pool of its own 9-length grid, so
#     the number here is an indicator, not the one that decides K.  For the real one,
#     run the split launch (`a100-detect.yaml`, then `a100-mask.yaml`); the difference is
#     why the split configs exist;
#   * is the checkpoint tree on the project disk intact?  The command passes
#     `--verify-hashes`, so the driver recomputes the registry SHA-256 of every pinned
#     file (~3.3 GB, a few seconds) instead of only checking presence.  A truncated
#     shard caught here costs minutes; caught in the full run it costs an hour at
#     542.88 RUB/h.  The cheap L4 scales keep the presence-only check.
#
# Grid: 3 needles x 2 lengths x 10 depths = 60 instances per model, capped by
# `--limit 60` so the count is explicit.  The full run is `a100.yaml`.

cmd: python3 scripts/datasphere_job.py --use-venv ${DS_PROJECT_HOME}/ai360-heads-in-the-haystack/venv --bootstrap-venv ${DS_PROJECT_HOME}/ai360-heads-in-the-haystack/venv --weights ${WEIGHTS} --models qwen3.5-0.8b qwen3-0.6b --profile a100 --dtype bfloat16 --verify-hashes --stages describe,detect --lengths 1024 4096 --limit 60 --out-prefix ds-preflight

flags:
  - attach-project-disk

inputs:
  - models:
      var: WEIGHTS

outputs:
  - ds-preflight

env:
  vars:
    PYTORCH_ALLOC_CONF: expandable_segments:True
  python:
    type: manual
    version: "3.10"
    requirements-file: scripts/requirements-platform.txt
    pip:
      no-deps: 'true'
    local-paths:
      - retrieval_heads
      - configs
      - scripts

cloud-instance-types:
  - g2.1               # 28 vCPU, 1x A100 80 GB
