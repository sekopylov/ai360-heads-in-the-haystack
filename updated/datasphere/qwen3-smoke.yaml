name: qwen3-thinking-storage-smoke
desc: Offline Qwen3-4B-Thinking-2507 on T4 with three short attention detection cases

flags:
  - attach-project-disk

cmd: >
  python3 job.py
  --profile smoke
  --adapter qwen3
  --model ${DS_PROJECT_HOME}/c0/models/Qwen/Qwen3-4B-Thinking-2507
  --output-root datasphere-results/qwen3-smoke
  --detection-data ${DETECTION_DATA}
  --dtype float16
  --device-map cuda:0
  --lengths 1000
  --depths 50
  --max-new-tokens 2048
  --retrieval-metric needle_token_multiset_v1

inputs:
  - data/haystack_for_detect: DETECTION_DATA
outputs:
  - datasphere-results/qwen3-smoke
env:
  vars:
    - HF_HUB_OFFLINE: "1"
    - TRANSFORMERS_OFFLINE: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - datasphere/job.py
      - retrieval_head_detection.py
      - retrieval_heads
cloud-instance-types:
  - gt4.1
