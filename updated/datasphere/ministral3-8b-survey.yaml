name: ministral3-8b-context-only-retrieval-survey
desc: 27 Ministral 3 detection generations with context-only instructions, all three metrics, 256-token cap and default CPU aggregation; no masking

# Same detection dataset, grid, metrics, scope, seed and aggregation as
# qwen3-8b-survey.yaml. Keep Ministral's smoke-tested A100/BF16/Flash prefill.
# The Instruct checkpoint is non-reasoning; observed decode remains eager.
# Ministral now uses a context-only prompt instead of the historical book prompt.
# Separate output directory preserves the completed original survey.
flags:
  - attach-project-disk
cmd: >
  bash -c '
  python3 retrieval_head_detection.py
  --adapter ministral3_8b_no_thinking
  --model ${DS_PROJECT_HOME}/c0/models/mistralai/Ministral-3-8B-Instruct-2512-BF16
  --output-root datasphere-results/ministral3-8b-context-only-survey
  --haystack-root ${DETECTION_DATA}
  --dtype bfloat16
  --device-map cuda:0
  --prefill-attention sdpa_flash
  --attention-scope all_decode_tokens
  --lengths 8000,16000,30000
  --depths 15,45,75
  --max-new-tokens 256
  --retrieval-metrics legacy,needle_token_multiset_v1,needle_attention_mass_v1
  --context-seed 42
  && python3 aggregate_head_scores.py
  --run datasphere-results/ministral3-8b-context-only-survey
  '
inputs:
  - data/haystack_for_detect: DETECTION_DATA
outputs:
  - datasphere-results/ministral3-8b-context-only-survey
env:
  vars:
    - HF_HUB_OFFLINE: "1"
    - TRANSFORMERS_OFFLINE: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - retrieval_head_detection.py
      - aggregate_head_scores.py
      - retrieval_heads
cloud-instance-types:
  - g2.1
