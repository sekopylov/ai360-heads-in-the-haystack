name: ministral3-8b-no-thinking-paul-graham-multiset-mask
desc: A100 BF16 Ministral 3 context-only Paul Graham masking, frozen token-multiset ranking, baseline and top/bottom 5/10/15/20/40/60/80/100

# Qwen Paul Graham protocol, keeping lengths 1/3/5/.../19 plus the maximum.
# 11 lengths x 10 depths x (baseline + 8 top + 8 bottom) = 1870 generations.
# k=0 is automatic; --topks accepts positive counts only. No random heads.
# Ranking: completed Ministral context-only survey, 23 cases with ROUGE >50.
# Same context-only prompt for detection and masking; legacy_uniform decode.
# A100 Flash prefill/decode, BF16, 256 output tokens. GPU masking not yet tested.
flags:
  - attach-project-disk
cmd: >
  python3 job.py
  --profile mask
  --adapter ministral3_8b_no_thinking
  --model ${DS_PROJECT_HOME}/c0/models/mistralai/Ministral-3-8B-Instruct-2512-BF16
  --output-root datasphere-results/ministral3-8b-no-thinking-paul-graham-multiset-mask-san-francisco
  --mask-data ${MASK_DATA}
  --mask-case-id paul-graham-san-francisco
  --head-scores ${HEAD_SCORES}
  --dtype bfloat16
  --device-map cuda:0
  --prefill-attention sdpa_flash
  --decode-attention sdpa_flash
  --attention-scope all_decode_tokens
  --lengths 1000,4053,7105,10158,13211,16263,19316,22368,25421,28474,30000
  --depths 0,11,22,33,44,56,67,78,89,100
  --max-new-tokens 256
  --topks 5,10,15,20,40,60,80,100
  --mask-selections top,bottom
  --context-count 1
  --context-seed 42
  --seed 42
inputs:
  - data/validation_haystacks: MASK_DATA
  - datasphere-results/ministral3-context-only-download/ministral3-8b-context-only-survey/detection/aggregation/head_scores_needle_token_multiset_v1.json: HEAD_SCORES
outputs:
  - datasphere-results/ministral3-8b-no-thinking-paul-graham-multiset-mask-san-francisco
env:
  vars:
    - HF_HUB_OFFLINE: "1"
    - TRANSFORMERS_OFFLINE: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - datasphere/job.py
      - needle_in_haystack_with_mask.py
      - retrieval_heads
cloud-instance-types:
  - g2.1
