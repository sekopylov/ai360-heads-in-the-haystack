name: qwen35-retrieval-full
desc: Qwen3.5-0.8B detection plus paired masking sweep

flags:
  - attach-project-disk

cmd: >
  python3 job.py
  --profile full
  --adapter qwen35
  --model Qwen/Qwen3.5-0.8B
  --model-search-dir ${DS_PROJECT_HOME}/models
  --output-root datasphere-results/full
  --detection-data ${DETECTION_DATA}
  --mask-data ${MASK_DATA}
  --dtype float16
  --device-map cuda:0
  --lengths 10000
  --depths 25,50,75
  --topks 4,8,16
  --context-count 3
  --random-repeats 3
  --seed 42

inputs:
  - data/haystack_for_detect: DETECTION_DATA
  - data/validation_haystacks: MASK_DATA

outputs:
  - datasphere-results/full

env:
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - datasphere/job.py
      - retrieval_head_detection.py
      - aggregate_head_scores.py
      - needle_in_haystack_with_mask.py
      - retrieval_heads

cloud-instance-types:
  - gt4.1
