name: glm4-6v-flash-no-thinking-paul-graham-attention-mass-mask
desc: A100 BF16 GLM-4.6V-Flash no-thinking context-only Paul Graham masking, frozen attention-mass ranking, baseline and top/bottom 5/10/15/20/40/60/80/100

# Identical masking protocol to the corresponding Ministral 3 YAML.
# 11 lengths x 10 depths x (baseline + 8 top + 8 bottom) = 1870 generations.
# k=0 is automatic; --topks accepts positive counts only. No random heads.
# Ranking: completed GLM survey bt13713fk021qlqi1imi, 27 cases with ROUGE >50.
# Official enable_thinking=False; context-only instructions, legacy_uniform decode.
# A100 Flash prefill/decode, BF16, 256 output tokens. GLM GPU masking not yet tested.
flags:
  - attach-project-disk
cmd: >
  python3 job.py
  --profile mask
  --adapter glm4_6v_flash_no_thinking
  --model ${DS_PROJECT_HOME}/c0/models/zai-org/GLM-4.6V-Flash
  --output-root datasphere-results/glm4-6v-flash-no-thinking-paul-graham-attention-mass-mask-san-francisco
  --mask-data ${MASK_DATA}
  --mask-case-id paul-graham-san-francisco
  --head-scores ${HEAD_SCORES}
  --dtype bfloat16
  --device-map cuda:0
  --prefill-attention sdpa_flash
  --decode-attention sdpa_flash
  --attention-scope all_decode_tokens
  --lengths 1000,4053,7105,10158,13211,16263,19316,22368,25421,28474,30000
  --depths 0,11,22,33,44,56,67,78,89,100
  --max-new-tokens 256
  --topks 5,10,15,20,40,60,80,100
  --mask-selections top,bottom
  --context-count 1
  --context-seed 42
  --seed 42
inputs:
  - data/validation_haystacks: MASK_DATA
  - datasphere-results/glm4-6v-flash-survey-download/glm4-6v-flash-no-thinking-context-only-survey/detection/aggregation/head_scores_needle_attention_mass_v1.json: HEAD_SCORES
outputs:
  - datasphere-results/glm4-6v-flash-no-thinking-paul-graham-attention-mass-mask-san-francisco
env:
  vars:
    - HF_HUB_OFFLINE: "1"
    - TRANSFORMERS_OFFLINE: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - datasphere/job.py
      - needle_in_haystack_with_mask.py
      - retrieval_heads
cloud-instance-types:
  - g2.1
