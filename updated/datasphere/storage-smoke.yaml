name: qwen35-storage-smoke
desc: Offline Qwen3.5-0.8B loading from project storage plus three short GPU detection cases

flags:
  - attach-project-disk

cmd: >
  python3 job.py
  --profile smoke
  --adapter qwen35
  --model ${DS_PROJECT_HOME}/c0/models/Qwen/Qwen3.5-0.8B
  --output-root datasphere-results/storage-smoke
  --detection-data ${DETECTION_DATA}
  --dtype float16
  --device-map cuda:0
  --lengths 1000
  --depths 50

inputs:
  - data/haystack_for_detect: DETECTION_DATA

outputs:
  - datasphere-results/storage-smoke

env:
  vars:
    - HF_HUB_OFFLINE: "1"
    - TRANSFORMERS_OFFLINE: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - datasphere/job.py
      - retrieval_head_detection.py
      - retrieval_heads

cloud-instance-types:
  - gt4.1
