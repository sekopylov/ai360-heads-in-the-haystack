name: qwen3-thinking-paired-masking
desc: 18 detection plus 306 paired baseline, top-head and random-head generations

flags:
  - attach-project-disk

cmd: >
  python3 job.py
  --profile full
  --adapter qwen3
  --model ${DS_PROJECT_HOME 1`/c0/models/Qwen/Qwen3-4B-Thinking-2507
  --output-root datasphere-results/qwen3-full
  --detection-data ${DETECTION_DATA}
  --mask-data ${MASK_DATA}
  --dtype float16
  --device-map cuda:0
  --prefill-attention sdpa_memory_efficient
  --lengths 4000,8000
  --depths 10,50,90
  --max-new-tokens 2048
  --retrieval-metric needle_token_multiset_v1
  --head-scores datasphere-results/qwen3-full/detection/aggregation/head_scores_needle_token_multiset_v1.json
  --topks 1,2,4,8
  --context-count 3
  --random-repeats 3
  --context-seed 42
  --seed 42

inputs:
  - data/haystack_for_detect: DETECTION_DATA
  - data/PaulGrahamEssays: MASK_DATA
outputs:
  - datasphere-results/qwen3-full
env:
  vars:
    - HF_HUB_OFFLINE: "1"
    - TRANSFORMERS_OFFLINE: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - datasphere/job.py
      - retrieval_head_detection.py
      - aggregate_head_scores.py
      - needle_in_haystack_with_mask.py
      - retrieval_heads
cloud-instance-types:
  - gt4.1
