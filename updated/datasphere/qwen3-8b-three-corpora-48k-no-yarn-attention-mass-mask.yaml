name: qwen3-8b-three-corpora-48k-no-yarn-attention-mass-mask
desc: A100 Flash GQA Paul Graham, Eugene Onegin and Hero of Our Time masking at 8k-48k with frozen attention-mass ranking and unscaled RoPE

flags:
  - attach-project-disk

cmd: >
  python3 job.py
  --profile mask
  --adapter qwen3_8b_no_yarn_64k
  --model ${DS_PROJECT_HOME}/c0/models/Qwen/Qwen3-8B
  --output-root datasphere-results/qwen3-8b-three-corpora-48k-no-yarn-attention-mass-mask
  --mask-data ${MASK_DATA}
  --mask-case-id paul-graham-velvet-pelican
  --mask-case-id eugene-onegin-glass-compass
  --mask-case-id hero-of-our-time-porcelain-beetle
  --head-scores ${HEAD_SCORES}
  --dtype float16
  --device-map cuda:0
  --prefill-attention sdpa_flash
  --decode-attention sdpa_flash
  --attention-scope all_decode_tokens
  --lengths 8000,16000,32000,48000
  --depths 15,45,75
  --max-new-tokens 2048
  --topks 4,16,64
  --mask-selections top,bottom
  --context-count 1
  --context-seed 42
  --seed 42

inputs:
  - data/validation_haystacks: MASK_DATA
  - datasphere-results/qwen3-8b-survey/detection/aggregation/head_scores_needle_attention_mass_v1.json: HEAD_SCORES

outputs:
  - datasphere-results/qwen3-8b-three-corpora-48k-no-yarn-attention-mass-mask

env:
  vars:
    - HF_HUB_OFFLINE: "1"
    - TRANSFORMERS_OFFLINE: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: datasphere/requirements-gpu.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu118
    local-paths:
      - datasphere/job.py
      - needle_in_haystack_with_mask.py
      - retrieval_heads

cloud-instance-types:
  - g2.1
