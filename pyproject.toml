[project]
name = "retrieval-heads"
version = "0.1.0"
description = "Clean re-implementation of 'Retrieval Head Mechanistically Explains Long-Context Factuality', architecture-aware for dense and hybrid linear/full-attention models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    # Upper bound because the code reaches into transformers internals that v5
    # exposes (`_attn_implementation`, patching module-level
    # `eager_attention_forward`, the `dtype=` kwarg, `_can_record_outputs` order).
    # A major bump can change those; the DataSphere lock pins 5.18.0.
    "transformers>=5.18,<5.19",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# pyyaml and packaging are imported directly by tests/test_datasphere_configs.py;
# relying on them arriving transitively (accelerate -> pyyaml, pip -> packaging)
# makes the test suite fragile on a lean install.
dev = ["pytest>=8.0", "pyyaml>=6.0", "packaging>=23.0"]

[project.scripts]
retrieval-heads = "retrieval_heads.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["retrieval_heads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: loads real model checkpoints and is therefore slow",
]
filterwarnings = [
    # Narrowed: a blanket DeprecationWarning ignore hides the earliest signal that a
    # transformers internal this code reaches into is moving.
    "error::DeprecationWarning:retrieval_heads.*",
    "default::DeprecationWarning:transformers.*",
]
