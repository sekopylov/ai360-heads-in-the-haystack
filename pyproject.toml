[project]
name = "retrieval-heads"
version = "0.1.0"
description = "Clean re-implementation of 'Retrieval Head Mechanistically Explains Long-Context Factuality', architecture-aware for dense and hybrid linear/full-attention models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "transformers>=4.57",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
retrieval-heads = "retrieval_heads.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["retrieval_heads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: loads real model checkpoints and is therefore slow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
